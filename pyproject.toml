[tool.pytest.ini_options]
# The repo root on the path, so `from src import ...` works in a clean clone
# without an editable install step.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: runs the real pipeline over the full feeds; needs data/raw",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
